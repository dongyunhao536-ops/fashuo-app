name: build-and-deploy

# 云端构建 + 推产物部署：push 到 main → GitHub runner 编译 standalone → scp 到 ECS → 激活。
# ECS（2核2G）彻底不参与编译。手动触发用 workflow_dispatch。
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "memory/**"
  workflow_dispatch:

permissions:
  contents: read

# 同一时间只跑一个部署，新 push 取消进行中的旧部署
concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 与 ECS 运行时一致；Supabase Realtime 在 Node <22 无原生 WebSocket 会在模块初始化时报错。
          node-version: "22"
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Type check
        run: npx tsc --noEmit --incremental false

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Build (standalone)
        env:
          NODE_ENV: production
          # 全部页面 force-dynamic；构建期只需合法占位，真实服务端凭据由 ECS 运行时注入。
          SUPABASE_URL: http://127.0.0.1:3001
          SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder
        run: npm run build

      - name: Assemble standalone bundle
        run: |
          cp -r public .next/standalone/ 2>/dev/null || true
          cp -r .next/static .next/standalone/.next/
          tar -czf "fashuo-${GITHUB_SHA}.tgz" -C .next/standalone .
          ls -lh "fashuo-${GITHUB_SHA}.tgz"

      - name: Copy bundle to ECS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          source: "fashuo-${{ github.sha }}.tgz"
          target: /tmp

      - name: Activate on ECS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            cd /opt/fashuo-app
            git pull --ff-only
            bash deploy/12-activate-standalone.sh "/tmp/fashuo-${{ github.sha }}.tgz" "${{ github.sha }}"
